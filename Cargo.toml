[package]
name = "carvi_rsd"
version = "0.1.0"
edition = "2024"

[features]
default = ["web_viewer"]
pcap = []
npcap-sdk-download = ["dep:reqwest", "dep:zip"]
web_viewer = ["rerun/web_viewer"]

[dependencies]
autocxx = "0.30.0"
cxx = "1.0"

[dev-dependencies]
anyhow = "1.0"
rerun = ">=0.28.1"

[build-dependencies]
autocxx-build = "0.30.0"
once_cell = "1.21.3"
pkg-config = "0.3.32"
reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "native-tls"], optional = true }
walkdir = "2.5.0"
zip = { version = "7.0.0", optional = true }
